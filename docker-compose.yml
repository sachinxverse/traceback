services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_CONFIG: production
      SECRET_KEY: ${SECRET_KEY:-please-change-this-secret}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-please-change-this-jwt-secret}
      DATABASE_URL: postgresql+psycopg2://traceback:traceback@db:5432/traceback
      BASE_URL: http://localhost:8000
      UPLOAD_DIR: /data/uploads
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-stub}
      COOKIE_SECURE: "false"
    volumes:
      - uploads:/data/uploads
      - model-cache:/home/appuser/.cache
    depends_on:
      - db
    command: sh -c "flask init-db && gunicorn -w 2 -k gthread --threads 4 -b 0.0.0.0:8000 wsgi:app"
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: traceback
      POSTGRES_PASSWORD: traceback
      POSTGRES_DB: traceback
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceback"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  uploads:
  model-cache:
