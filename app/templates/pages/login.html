{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height:62vh"><div class="col-md-5">
<div class="card p-4" style="border-radius:18px">
<div class="text-center mb-3">
  <span class="brand-mark mx-auto mb-2" style="width:44px;height:44px"><i class="bi bi-geo-alt-fill"></i></span>
  <h2 class="mb-1">Welcome back</h2>
  <p class="text-muted small mb-0">Log in to track your reports, matches and claims.</p>
</div>
<form id="login-form">
  <div class="mb-3"><label class="form-label" for="email">Email</label>
    <input class="form-control" type="email" id="email" name="email" required></div>
  <div class="mb-3"><label class="form-label" for="password">Password</label>
    <input class="form-control" type="password" id="password" name="password" required></div>
  <button class="btn btn-primary w-100" type="submit"><i class="bi bi-box-arrow-in-right me-1"></i>Log in</button>
</form>
<p class="mt-3 mb-0 small">No account? <a href="/register">Register</a></p>
</div></div></div>
{% endblock %}
