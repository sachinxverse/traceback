{% extends "base.html" %}
{% block content %}
<h1>Report moderation</h1>
<form class="row g-2 mb-3" id="filter-form">
  <div class="col-md-3"><input class="form-control" name="q" placeholder="Search…"></div>
  <div class="col-md-2"><select class="form-select" name="status"><option value="">Any status</option>
    {% for s in ['ACTIVE','CLAIM_PENDING','RECOVERED','CLOSED','EXPIRED','REMOVED'] %}<option>{{ s }}</option>{% endfor %}</select></div>
  <div class="col-md-2"><select class="form-select" name="type"><option value="">Any type</option>
    <option>LOST</option><option>FOUND</option></select></div>
  <div class="col-md-2"><button class="btn btn-primary w-100">Filter</button></div>
</form>
<table class="table align-middle" id="reports-table"><thead>
  <tr><th>ID</th><th>Title</th><th>Type</th><th>Status</th><th>Owner</th><th></th></tr>
</thead><tbody></tbody></table>

<div class="modal fade" id="reason-modal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title">Reason</h5></div>
  <div class="modal-body"><input class="form-control" id="reason-input" placeholder="Reason for moderation"></div>
  <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
  <button class="btn btn-danger" id="reason-confirm">Confirm</button></div>
</div></div></div>
{% endblock %}
{% block scripts %}<script type="module" src="/static/js/admin.js"></script>{% endblock %}
