{% extends "base.html" %}
{% block content %}
<h1>Admin portal</h1>
<p class="text-muted small">Impact metrics should be validated with pilot data.</p>
<div class="row g-3 mb-4" id="kpi-cards"></div>
<div class="row g-4">
  <div class="col-lg-6"><div class="card p-3"><h5>Reports per day (lost vs found)</h5><canvas id="timeseries-chart"></canvas></div></div>
  <div class="col-lg-6"><div class="card p-3"><h5>Category breakdown</h5><canvas id="category-chart"></canvas></div></div>
</div>
<div class="card p-3 mt-4"><h5>Heatmap</h5>
  <div class="d-flex gap-2 mb-2">
    <input type="date" id="hm-from" class="form-control" style="max-width:180px">
    <input type="date" id="hm-to" class="form-control" style="max-width:180px">
    <button class="btn btn-outline-primary" id="hm-apply">Apply</button>
  </div>
  <div id="admin-heatmap"></div>
  <div class="text-muted small mt-2">Cells with fewer than 2 reports are hidden for privacy.</div>
</div>
{% endblock %}
{% block scripts %}<script type="module" src="/static/js/admin.js"></script>{% endblock %}
