{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height:62vh"><div class="col-md-5">
<div class="card p-4" style="border-radius:18px">
<div class="text-center mb-3">
  <span class="brand-mark mx-auto mb-2" style="width:44px;height:44px"><i class="bi bi-geo-alt-fill"></i></span>
  <h2 class="mb-1">Join TRACEBACK</h2>
  <p class="text-muted small mb-0">One account for lost and found reports.</p>
</div>
<form id="register-form">
  <div class="mb-3"><label class="form-label" for="name">Full name</label>
    <input class="form-control" id="name" name="name" required minlength="2"></div>
  <div class="mb-3"><label class="form-label" for="email">Email</label>
    <input class="form-control" type="email" id="email" name="email" required></div>
  <div class="mb-3"><label class="form-label" for="phone">Phone (optional, private)</label>
    <input class="form-control" id="phone" name="phone"></div>
  <div class="mb-3"><label class="form-label" for="password">Password</label>
    <input class="form-control" type="password" id="password" name="password" required minlength="8"
      pattern=".*[A-Za-z].*\d.*|\d.*[A-Za-z].*" title="At least 8 characters with a letter and a digit">
    <div class="form-text">Min 8 characters, at least one letter and one digit.</div></div>
  <button class="btn btn-primary w-100" type="submit"><i class="bi bi-person-plus me-1"></i>Create account</button>
</form>
<p class="mt-3 mb-0 small">Already registered? <a href="/login">Log in</a></p>
</div></div></div>
{% endblock %}
